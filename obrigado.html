<style>
:root{--branco:#FFFFFF;--marfim:#F7F3ED;--dourado:#A9834C;--dourado-claro:#D9C29A;--vinho:#5A1823;--tinta:#2B2320;--tinta-suave:#6E625B;--linha:#E7DDCF;
--display:"Cormorant Garamond",Garamond,"Times New Roman",serif;--corpo:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--branco),var(--marfim));color:var(--tinta);font-family:var(--corpo);font-weight:300;line-height:1.6;display:grid;place-items:center;padding:24px 18px}
.cartao{width:100%;max-width:460px;background:var(--branco);border:1px solid var(--linha);border-top:3px solid var(--dourado);padding:40px 28px 32px;text-align:center;box-shadow:0 30px 60px -30px rgba(90,24,35,.22)}
.logo{width:96px;height:auto;margin:0 auto 26px;display:block}
h1{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.15;margin:0 0 12px;text-wrap:balance}
h1 em{color:var(--dourado)}
p{margin:0 0 26px;color:var(--tinta-suave);font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:var(--corpo);font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:18px 20px;background:var(--dourado);color:var(--branco);border-radius:2px;transition:background .25s}
.btn:hover{background:var(--vinho)}
.btn svg{width:20px;height:20px;fill:currentColor}
.aviso{font-size:13px;color:var(--tinta-suave);margin:16px 0 0}
.barra{height:2px;background:var(--linha);margin-top:22px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--dourado);animation:enche 4s linear forwards}
@keyframes enche{to{width:100%}}
.voltar{display:inline-block;margin-top:22px;font-size:13px;color:var(--tinta-suave)}
:focus-visible{outline:2px solid var(--dourado);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.barra i{animation:none;width:100%}}
</style>

<main class="cartao">
  <img class="logo" src="logo.png" alt="Lumière Clinic" width="491" height="449">
  <h1>Recebemos seu pedido de <em>avaliação</em>.</h1>
  <p>Falta só um passo: envie a mensagem que já deixamos pronta no WhatsApp e nossa equipe responde para agendar o melhor horário para você.</p>
  <a class="btn" id="ir" href="https://wa.me/5511939353571">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
    Continuar no WhatsApp
  </a>
  <p class="aviso" id="aviso">Abrindo o WhatsApp automaticamente…</p>
  <div class="barra" aria-hidden="true"><i></i></div>
  <a class="voltar" href="index.html">Voltar ao site</a>
</main>
<script>
const WHATS = "5511939353571";
let lead = null;
try { lead = JSON.parse(sessionStorage.getItem("lumiere_lead") || "null"); } catch (e) {}
const link = (lead && lead.link) || ("https://wa.me/" + WHATS + "?text=" + encodeURIComponent("Olá! Vim pelo site da Lumière Clinic e gostaria de agendar uma avaliação."));
document.getElementById("ir").href = link;

/* Conversão: só conta uma vez por envio (recarregar a página não duplica) */
let contado = false;
try { contado = sessionStorage.getItem("lumiere_contado") === link; } catch (e) {}
if (!contado) {
  try { gtag("event", "conversion", { send_to: "AW-18453692480/KQilCPOP074dEMCAtN9E", transport_type: "beacon" }); } catch (e) {}
  try { fbq("track", "Lead", lead ? { content_name: lead.servico, content_category: lead.paciente } : {}); } catch (e) {}
  try { sessionStorage.setItem("lumiere_contado", link); } catch (e) {}
}

/* Redireciona depois de 4 s, tempo para as tags enviarem os dados */
setTimeout(() => {
  document.getElementById("aviso").textContent = "Se o WhatsApp não abriu, toque no botão acima.";
  if (!contado) window.location.href = link;
}, 4000);
</script>
